services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sellerbottel-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - /home/reaagent/idse-ai-gateway/bot_key.txt:/home/reaagent/idse-ai-gateway/bot_key.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/api/v2/platform/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

