services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sellerbottel-v2-backend-dev
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - ./backend/.env
    network_mode: host
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sellerbottel-v2-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - sellerbottel-dev

networks:
  sellerbottel-dev:
    driver: bridge
